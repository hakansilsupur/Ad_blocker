<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AdBlock</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">◈</span>
      <h1>AdBlock</h1>
      <span id="state-pill" class="pill">on</span>
    </header>

    <section class="counts">
      <div class="count">
        <span id="tab-blocked" class="value">0</span>
        <span class="label">on this page</span>
      </div>
      <div class="count">
        <span id="total-blocked" class="value">0</span>
        <span class="label">since install</span>
      </div>
    </section>

    <section class="toggles">
      <label class="row">
        <span class="row-text">
          <strong>Blocking enabled</strong>
          <small>Turns the whole extension off</small>
        </span>
        <input type="checkbox" id="toggle-enabled" />
      </label>

      <label class="row">
        <span class="row-text">
          <strong>Allow ads on <span id="site-name">this site</span></strong>
          <small>Exempt this site when something breaks</small>
        </span>
        <input type="checkbox" id="toggle-site" />
      </label>
    </section>

    <footer>
      <button id="reload" type="button">Reload page</button>
      <button id="reset" type="button" class="link">Reset counter</button>
    </footer>

    <p class="note">
      Ads inside native apps need the DNS sinkhole — see the project README.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
