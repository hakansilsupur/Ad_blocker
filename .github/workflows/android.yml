name: Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Both builds together take about two minutes. Without a limit a wedged
    # runner sits at GitHub's six-hour default before anyone finds out.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run the core logic tests on the JVM
        run: android/run-tests.sh

      # The toolchain-only build: no Gradle, no plugin download. This is the
      # APK that gets published as an artifact.
      - name: Build the APK with the SDK build tools
        run: android/build.sh

      # The conventional build, kept in CI so the two paths cannot drift.
      - name: Build the APK with Gradle
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the APK is well formed
        run: |
          set -euo pipefail
          APK=android/build/adblock-debug.apk
          # Runners carry several build-tools versions, so pick exactly one:
          # an unquoted glob here passes the other paths as arguments.
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "using ${TOOLS}"
          "${TOOLS}apksigner" verify --verbose "$APK"
          "${TOOLS}aapt" dump badging "$APK" | head -5
          # Both build paths must produce an APK, not just exit zero. Matched
          # by glob rather than an assumed filename, and without a pipe: under
          # pipefail, `ls | head` can die of SIGPIPE when there are several.
          shopt -s nullglob
          GRADLE_APKS=(android/build/outputs/apk/debug/*.apk)
          test "${#GRADLE_APKS[@]}" -gt 0
          echo "gradle APK: ${GRADLE_APKS[0]}"
          test -s "${GRADLE_APKS[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: adblock-debug-apk
          path: |
            android/build/adblock-debug.apk
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
